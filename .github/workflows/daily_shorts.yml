name: Ya Olsaydi 10:00 AM Daily Video Bot

on:
  schedule:
    # Her gün Türkiye saatiyle sabah tam 10:00'da çalışır (10:00 TSİ = 07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # GitHub panelinden tek tıkla test etme butonu

permissions:
  contents: write

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: FFmpeg ve Fontları Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat
          mkdir -p ~/.local/share/fonts
          cp assets/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          fc-cache -f -v

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Günün 21 Saniyelik Videosunu Üret ve Telegram'a Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8882292811:AAFLAsm5c7OBsnN8iVU2MWpwfPeTxwRGHMg' }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID || '1934709259' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Paylaşım Geçmişini Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git diff --staged --quiet || (git commit -m "chore: update history [skip ci]" && git push) || true
